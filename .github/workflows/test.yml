name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache Poetry virtual environment
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pypoetry
          .venv
        key: ${{ runner.os }}-poetry-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}
        restore-keys: |
          ${{ runner.os }}-poetry-${{ matrix.python-version }}-
          ${{ runner.os }}-poetry-

    - name: Install Poetry
      run: |
        python -m pip install poetry
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        echo "$HOME/.poetry/bin" >> $GITHUB_PATH

    - name: Configure Poetry
      run: |
        poetry config virtualenvs.create true
        poetry config virtualenvs.in-project true

    - name: Install dependencies
      run: poetry install --no-interaction

    - name: Run pre-commit hooks
      run: poetry run pre-commit run --all-files

    - name: Run tests
      run: poetry run pytest --cov=open_trading_algo --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache Poetry virtual environment
      uses: actions/cache@v4
      with:
        path: ~/.cache/pypoetry
        key: poetry-lint-${{ hashFiles('**/poetry.lock') }}

    - name: Install Poetry
      run: |
        python -m pip install --user poetry
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        echo "$HOME/.poetry/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: poetry install --no-interaction

    # - name: Run type checking
    #   run: poetry run mypy open_trading_algo/ --ignore-missing-imports

    - name: Check code formatting
      run: |
        poetry run black --check --diff --config pyproject.toml open_trading_algo/ tests/ scripts/
        # poetry run isort --check-only --diff --settings-path pyproject.toml open_trading_algo/ tests/ scripts/

  build:
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Poetry
      run: |
        python -m pip install --user poetry
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        echo "$HOME/.poetry/bin" >> $GITHUB_PATH

    - name: Build package
      run: poetry build

    - name: Check package
      run: |
        pip install dist/open_trading_algo-*.tar.gz
        python -c "import open_trading_algo; print('✅ Package builds and imports successfully')"
