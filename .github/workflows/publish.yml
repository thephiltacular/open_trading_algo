name: Publish to PyPI

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags like v1.0.0, v2.1.3, etc.
  workflow_dispatch:  # Allow manual triggering

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: release  # Use release environment for security

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache Poetry virtual environment
      uses: actions/cache@v4
      with:
        path: ~/.cache/pypoetry
        key: poetry-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}
        restore-keys: |
          poetry-${{ runner.os }}-

    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Configure Poetry
      run: |
        poetry config virtualenvs.create true
        poetry config virtualenvs.in-project true

    - name: Install dependencies
      run: poetry install --no-dev --no-interaction

    - name: Run tests
      run: poetry run pytest --no-cov

    - name: Build package
      run: poetry build

    - name: Check package contents
      run: |
        echo "Package files:"
        ls -la dist/
        echo "Package contents:"
        tar -tzf dist/*.tar.gz | head -20

    - name: Test package installation
      run: |
        pip install dist/open_trading_algo-*.tar.gz
        python -c "import open_trading_algo; print('✅ Package import successful')"

    - name: Publish to PyPI
      env:
        POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        poetry publish --no-interaction

    - name: Create GitHub Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        release_name: Release ${{ github.ref_name }}
        body: |
          ## Changes in this release

          ### 🚀 New Features
          - [Add new features here]

          ### 🐛 Bug Fixes
          - [Add bug fixes here]

          ### 📚 Documentation
          - [Add documentation updates here]

          ### 🔧 Maintenance
          - [Add maintenance changes here]

          ---
          **Full Changelog**: [Compare changes](https://github.com/${{ github.repository }}/compare/v${{ github.event.repository.updated_at }}...${{ github.ref_name }})

          **Installation**: `pip install open_trading_algo==${{ github.ref_name }}`
        draft: false
        prerelease: false
